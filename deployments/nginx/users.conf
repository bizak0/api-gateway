server {
    listen 80;

    location /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"users-service"}';
    }

    location /public {
        default_type application/json;
        return 200 '{"service":"users-service","message":"Public users endpoint","data":["user1","user2","user3"]}';
    }

    location /private {
        default_type application/json;
        return 200 '{"service":"users-service","message":"Private users endpoint","data":{"id":1,"name":"John Doe"}}';
    }

    location /v1/users {
        default_type application/json;
        return 200 '{"service":"users-service","version":"v1","users":["Alice","Bob","Charlie"]}';
    }

    location /v2/users {
        default_type application/json;
        return 200 '{"service":"users-service","version":"v2","users":[{"id":1,"name":"Alice","email":"alice@example.com"}]}';
    }

    location / {
        default_type application/json;
        return 200 '{"service":"users-service","status":"running"}';
    }
}