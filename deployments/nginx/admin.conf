server {
    listen 80;

    location /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"admin-service"}';
    }

    location /admin {
        default_type application/json;
        return 200 '{"service":"admin-service","message":"Admin panel","stats":{"users":42,"orders":128,"uptime":"99.9%"}}';
    }

    location / {
        default_type application/json;
        return 200 '{"service":"admin-service","status":"running"}';
    }
}