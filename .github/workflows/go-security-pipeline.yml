name: Go API Gateway - Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # -------------------------------------------------------
  # JOB 1 : SAST - Analyse Statique du code source Go
  # Outil : CodeQL (détecte failles logiques, injections, etc.)
  # -------------------------------------------------------
  sast-scan:
    name: Analyse Statique CodeQL (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Initialisation de CodeQL pour Go
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Compilation automatique par CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Exécution de l'analyse CodeQL
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------
  # JOB 2 : Secret Scanning - Détection de secrets dans le code
  # Outil : Gitleaks (clés API, tokens, mots de passe commités)
  # -------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Scan des secrets dans le code et l'historique git
        run: |
          gitleaks detect --source . --verbose \
            --report-format json \
            --report-path gitleaks-report.json || true

      - name: Affichage du résumé des secrets détectés
        run: |
          echo "=== Secrets détectés par Gitleaks ==="
          cat gitleaks-report.json 2>/dev/null || echo "Aucun rapport généré"

      - name: Upload du rapport Gitleaks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # -------------------------------------------------------
  # JOB 3 : SCA - Analyse des dépendances Go
  # Outil : Trivy (vérifie les CVE dans go.mod / go.sum)
  # -------------------------------------------------------
  sca-scan:
    name: Analyse SCA Trivy (dépendances Go)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scan des dépendances Go (go.mod)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'

  # -------------------------------------------------------
  # JOB 3 : DAST - Analyse Dynamique (test en conditions réelles)
  # Outil : OWASP ZAP
  # Chaîne complète : Proxy(:8443) -> Gateway(:8081) -> LoadBalancer(:8082) -> Mocks
  # -------------------------------------------------------
  dast-scan:
    name: Analyse Dynamique OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Installation des dépendances Go
        run: go mod download

      - name: Compilation des 3 composants
        run: |
          go build -o loadbalancer ./cmd/loadbalancer
          go build -o gateway ./cmd/gateway
          go build -o proxy ./cmd/proxy

      - name: Génération du certificat TLS auto-signé
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 1 -nodes -subj "/CN=localhost"

      - name: Démarrage des microservices mock
        run: |
          start_mock() {
            python3 -c "
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"ok\"}')
              def log_message(self, *a): pass
          HTTPServer(('', $1), H).serve_forever()" &
          }
          start_mock 9091
          start_mock 9092
          start_mock 9093
          sleep 3
          echo "Mocks démarrés sur 9091, 9092, 9093"

      - name: Démarrage du Load Balancer (:8082)
        run: |
          ./loadbalancer &
          sleep 3
          echo "Load Balancer démarré sur :8082"

      - name: Démarrage du API Gateway (:8081)
        run: |
          ./gateway &
          sleep 3
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8081/public || true
          echo "API Gateway démarré sur :8081"

      - name: Démarrage du Reverse Proxy TLS (:8443)
        run: |
          ./proxy &
          sleep 5
          echo "Reverse Proxy TLS démarré sur :8443"

      - name: Autoriser les permissions d'écriture pour ZAP
        run: chmod 777 $GITHUB_WORKSPACE

      - name: Scan OWASP ZAP (via Reverse Proxy HTTPS)
        uses: zaproxy/action-baseline@v0.14.0
        env:
          ZAP_AUTH_HEADER: "Authorization"
          ZAP_AUTH_HEADER_VALUE: "${{ secrets.ZAP_AUTH_TOKEN }}"
          ZAP_AUTH_HEADER_SITE: "https://localhost:8443"
        with:
          target: 'https://localhost:8443'
          cmd_options: '-z "-config network.tls.trustAllCerts=true"'
          fail_action: false
