name: Go API Gateway - Security Pipeline

# Déclenchement : à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # -------------------------------------------------------
  # JOB 1 : SAST - Analyse Statique du code source Go
  # Outil : CodeQL (détecte failles logiques, injections, etc.)
  # -------------------------------------------------------
  sast-scan:
    name: Analyse Statique CodeQL (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Initialisation de CodeQL pour Go
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Compilation automatique par CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Exécution de l'analyse CodeQL
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------
  # JOB 2 : SCA - Analyse des dépendances Go
  # Outil : Trivy (vérifie les CVE dans go.mod / go.sum)
  # -------------------------------------------------------
  sca-scan:
    name: Analyse SCA Trivy (dépendances Go)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scan des dépendances Go (go.mod)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'           # scan du système de fichiers
          scan-ref: '.'             # depuis la racine du projet
          format: 'table'           # affichage en tableau dans les logs
          exit-code: '0'            # ne bloque pas le pipeline sur avertissement
          ignore-unfixed: true      # ignore les CVE sans correctif disponible
          vuln-type: 'library'      # cible uniquement les dépendances
          severity: 'HIGH,CRITICAL' # remonte uniquement les failles graves

  # -------------------------------------------------------
  # JOB 3 : DAST - Analyse Dynamique (test en conditions réelles)
  # Outil : OWASP ZAP
  # Chaîne complète : Proxy(:8443) -> Gateway(:8081) -> LoadBalancer(:8082)
  # -------------------------------------------------------
  dast-scan:
    name: Analyse Dynamique OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Installation des dépendances Go
        run: go mod download

      # Compilation des 3 composants
      - name: Compilation des 3 composants
        run: |
          go build -o loadbalancer ./cmd/loadbalancer
          go build -o gateway ./cmd/gateway
          go build -o proxy ./cmd/proxy

      # Demarrage dans le bon ordre : LB d'abord, puis Gateway, puis Proxy
      - name: Démarrage du Load Balancer (:8082)
        run: |
          ./loadbalancer &
          sleep 3
          echo "Load Balancer démarré sur :8082"

      - name: Démarrage du API Gateway (:8081)
        run: |
          ./gateway &
          sleep 3
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8081/public || echo "Gateway pas encore prêt"
          echo "API Gateway démarré sur :8081"

      # Reverse Proxy = vrai point d'entrée (HTTPS :8443)
      - name: Démarrage du Reverse Proxy TLS (:8443)
        run: |
          ./proxy &
          sleep 5
          echo "Reverse Proxy TLS démarré sur :8443"

      - name: Autoriser les permissions d'écriture pour ZAP
        run: chmod 777 $GITHUB_WORKSPACE

      # ZAP cible le Reverse Proxy (point d'entrée réel de la chaîne)
      # cmd_options permet à ZAP d'ignorer le certificat TLS auto-signé
      - name: Scan OWASP ZAP (via Reverse Proxy HTTPS)
        uses: zaproxy/action-baseline@v0.14.0
        env:
          ZAP_AUTH_HEADER: "Authorization"
          ZAP_AUTH_HEADER_VALUE: "${{ secrets.ZAP_AUTH_TOKEN }}"
          ZAP_AUTH_HEADER_SITE: "https://localhost:8443"
        with:
          target: 'https://localhost:8443'
          cmd_options: '-z "-config network.tls.trustAllCerts=true"'
          fail_action: false